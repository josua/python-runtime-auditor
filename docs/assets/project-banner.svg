<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Python Runtime Auditor — Every Python. In context.</title>
  <desc id="description">A Windows and PowerShell tool to discover Python runtimes and their dependencies before changing anything.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#152840"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#79c9ff"/><stop offset="1" stop-color="#b0e8d9"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a2c9eb" stroke-opacity=".055"/></pattern></defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="38" y="38" width="52" height="52" rx="15" fill="#1e3b59" stroke="#4a82a8"/><text x="64" y="72" text-anchor="middle" fill="#b8dfff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Py</text>
  <text x="108" y="61" fill="#dfeaf7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Python Runtime Auditor</text>
  <text x="108" y="81" fill="#8da8c1" font-family="Consolas,monospace" font-size="11" letter-spacing="1.7">LOCAL DIAGNOSTICS / OPEN SOURCE</text>
  <text x="42" y="163" fill="#f0f5fc" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Every Python.</text>
  <text x="42" y="222" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2">In context.</text>
  <text x="44" y="263" fill="#adc0d5" font-family="Segoe UI,Arial,sans-serif" font-size="17">Find runtimes. Trace dependencies. Review before removing.</text>
  <rect x="44" y="292" width="94" height="27" rx="6" fill="#233b55"/><text x="91" y="310" text-anchor="middle" fill="#c5d9ee" font-family="Consolas,monospace" font-size="11">WINDOWS</text>
  <rect x="148" y="292" width="131" height="27" rx="6" fill="#233b55"/><text x="213" y="310" text-anchor="middle" fill="#c5d9ee" font-family="Consolas,monospace" font-size="11">POWERSHELL 7.2+</text>
  <rect x="289" y="292" width="115" height="27" rx="6" fill="#25443c"/><text x="346" y="310" text-anchor="middle" fill="#b0e8c8" font-family="Consolas,monospace" font-size="11">READ-ONLY</text>
  <g font-family="Consolas,monospace" font-size="15"><path d="M769 180h48m0-63v126m0-126h39m-39 63h39m-39 63h39" stroke="#527f9f" stroke-width="2" fill="none"/>
    <rect x="627" y="143" width="142" height="74" rx="12" fill="#213c56" stroke="#6ca9cd"/><text x="698" y="174" text-anchor="middle" fill="#f6d684">python312</text><text x="698" y="198" text-anchor="middle" fill="#9abed8" font-size="12">base runtime</text>
    <g fill="#172c41" stroke="#42617d"><rect x="856" y="90" width="243" height="55" rx="9"/><rect x="856" y="153" width="243" height="55" rx="9"/><rect x="856" y="216" width="243" height="55" rx="9"/></g>
    <g fill="#c3d9eb"><text x="876" y="124">art-project/.venv</text><text x="876" y="187">audio-tools/.venv</text><text x="876" y="250">web-app/.venv</text></g>
    <text x="860" y="299" fill="#87a4bf" font-size="11">DEPENDENCIES, NOT GUESSWORK</text>
  </g>
</svg>
